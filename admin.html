<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Pizarra Bet | Panel Administrador</title>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #111622;
            --card-border: #1e2638;
            --neon-green: #00ff88;
            --neon-blue: #00d9ff;
            --neon-gold: #ffb700;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px 10px; }

        .admin-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .admin-header {
            background-color: var(--card-bg);
            border: 2px solid var(--neon-blue);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 16px; color: var(--neon-blue); text-transform: uppercase; }

        .admin-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .form-control {
            background-color: #07090e;
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            width: 100%;
        }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .btn-submit {
            background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            margin-top: 10px;
        }

        .btn-logout {
            background-color: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>⚙️ Panel Administrador</h1>
                <p id="adminEmail" style="font-size: 10px; color: var(--text-muted);">Cargando sesión...</p>
            </div>
            <button class="btn-logout" onclick="logoutAdmin()">Cerrar Sesión</button>
        </div>

        <div class="admin-card">
            <h2 style="font-size: 14px; color: var(--neon-green); margin-bottom: 15px; text-transform: uppercase;">Publicar Nuevo Pronóstico</h2>
            <form id="createPickForm" onsubmit="publishPick(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Sección</label>
                        <select id="pickSection" class="form-control">
                            <option value="general">Feed General</option>
                            <option value="vip">Zona VIP 🌟</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Costo (Créditos)</label>
                        <input type="number" id="pickCost" class="form-control" value="2" min="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Equipos / Partido</label>
                        <input type="text" id="pickTeams" class="form-control" placeholder="Ej: Real Madrid vs Barcelona" required>
                    </div>
                    <div class="form-group">
                        <label>Probabilidad (%)</label>
                        <input type="text" id="pickProb" class="form-control" value="85%" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cuota</label>
                        <input type="text" id="pickOdd" class="form-control" value="1.50" required>
                    </div>
                    <div class="form-group">
                        <label>Etiqueta / Fecha</label>
                        <input type="text" id="pickMeta" class="form-control" value="📅 Hoy • Análisis Táctico" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pronóstico Exacto (Pick)</label>
                    <input type="text" id="pickResult" class="form-control" placeholder="Ej: Gana Local + Más de 1.5 Goles" required>
                </div>

                <div class="form-group">
                    <label>Respaldo Estadístico</label>
                    <textarea id="pickStats" class="form-control" rows="4" placeholder="Escribe el desglose de datos..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">🚀 Publicar en la Base de Datos</button>
            </form>
        </div>
    </div>

    <script>
        // Configuración Supabase
        const SUPABASE_URL = 'https://grqoeyhrejzdsbbonjqk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DMZGeboSDss26jQoSO3SiA_CVxP51Wy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Protección de la vista Admin al cargar
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();

            // Si no hay sesión iniciada, manda al login principal
            if (!session) {
                alert('⚠️ Acceso denegado. Debes iniciar sesión primero.');
                window.location.href = 'index.html';
                return;
            }

            // Consultar si el usuario logueado tiene rol admin en la tabla profiles
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();

            if (error || !profile || profile.role !== 'admin') {
                alert('⛔ No tienes permisos de administrador.');
                window.location.href = 'index.html';
                return;
            }

            // Si pasa las validaciones, mostramos su correo
            document.getElementById('adminEmail').innerText = session.user.email;
        });

        // Función para guardar el pronóstico en la tabla 'picks'
        async function publishPick(e) {
            e.preventDefault();

            const newPick = {
                section: document.getElementById('pickSection').value,
                cost: parseInt(document.getElementById('pickCost').value),
                teams: document.getElementById('pickTeams').value.trim(),
                prob: document.getElementById('pickProb').value.trim(),
                odd: document.getElementById('pickOdd').value.trim(),
                meta: document.getElementById('pickMeta').value.trim(),
                result: document.getElementById('pickResult').value.trim(),
                stats: document.getElementById('pickStats').value.trim()
            };

            const { data, error } = await supabase
                .from('picks')
                .insert([newPick]);

            if (error) {
                alert('Error al publicar: ' + error.message);
            } else {
                alert('✅ ¡Pronóstico guardado exitosamente en Supabase!');
                document.getElementById('createPickForm').reset();
            }
        }

        async function logoutAdmin() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
