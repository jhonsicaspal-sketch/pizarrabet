<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Pizarra Bet | Pronósticos Deportivos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #111622;
            --card-border: #1e2638;
            --neon-green: #00ff88;
            --neon-blue: #00d9ff;
            --neon-gold: #ffb700;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 15px 10px; }

        header {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .brand { font-size: 18px; font-weight: 800; color: var(--neon-green); text-transform: uppercase; }
        .user-status { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .credit-badge { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 4px 8px; border-radius: 20px; font-weight: bold; }
        
        .btn-action {
            background-color: var(--neon-blue);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .auth-card input {
            background-color: #07090e;
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }

        .pick-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }
        .pick-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .pick-teams { font-size: 15px; font-weight: bold; color: var(--text-main); margin-bottom: 10px; }
        .pick-info { display: flex; gap: 15px; font-size: 12px; margin-bottom: 12px; }
        .pick-info span { color: var(--neon-gold); font-weight: bold; }

        .locked-content {
            filter: blur(4px);
            user-select: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 6px;
        }

        .unlocked-content {
            background: rgba(0, 255, 136, 0.05);
            border: 1px dashed var(--neon-green);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--neon-green);
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-green) 0%, #00b359 100%);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">⚽ La Pizarra Bet</div>
        <div class="user-status" id="userStatus">
            <span style="color: var(--text-muted);">Verificando...</span>
        </div>
    </header>

    <div class="container">
        <div id="authSection" class="auth-card">
            <h3 style="font-size: 14px; color: var(--neon-blue);">Ingresar / Registrarse</h3>
            <input type="email" id="emailInput" placeholder="Tu correo electrónico">
            <input type="password" id="passwordInput" placeholder="Tu contraseña">
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button class="btn-action" style="flex:1;" onclick="handleLogin()">Iniciar Sesión</button>
                <button class="btn-action" style="flex:1; background-color: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);" onclick="handleSignUp()">Registrarse</button>
            </div>
        </div>

        <div id="picksFeed">
            <p style="text-align: center; font-size: 12px; color: var(--text-muted);">Cargando pronósticos...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://grqoeyhrejzdsbbonjqk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DMZGeboSDss26jQoSO3SiA_CVxP51Wy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            await loadPicks();
        });

        async function checkUserSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const statusDiv = document.getElementById('userStatus');
                const authSection = document.getElementById('authSection');

                if (session) {
                    currentUser = session.user;
                    authSection.style.display = 'none';

                    const { data: profile, error } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', currentUser.id)
                        .maybeSingle();

                    if (error) {
                        console.error("Error cargando perfil:", error);
                    }

                    userProfile = profile;

                    if (userProfile && userProfile.role === 'admin') {
                        window.location.href = 'admin.html';
                        return;
                    }

                    statusDiv.innerHTML = `
                        <span class="credit-badge">⚡ ${userProfile ? userProfile.credits : 0} Créditos</span>
                        <button class="btn-action" style="background-color: rgba(255,77,77,0.2); color: #ff4d4d;" onclick="logout()">Salir</button>
                    `;
                } else {
                    statusDiv.innerHTML = `<span style="color: var(--text-muted);">Invitado</span>`;
                    authSection.style.display = 'flex';
                }
            } catch (err) {
                alert("Error al verificar sesión: " + err.message);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!email || !password) {
                alert('Por favor completa correo y contraseña.');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('❌ Error al iniciar sesión: ' + error.message);
                return;
            }

            // Consultar rol en la base de datos
            const { data: profile, error: profError } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', data.user.id)
                .maybeSingle();

            if (profError) {
                alert('Error al leer el rol: ' + profError.message);
            }

            if (profile && profile.role === 'admin') {
                alert('🚀 Redirigiendo al Panel Admin...');
                window.location.href = 'admin.html';
            } else {
                alert('✅ Inicio de sesión correcto. Redirigiendo...');
                location.reload();
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!email || !password) {
                alert('Por favor completa correo y contraseña.');
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                alert('Error en registro: ' + error.message);
            } else {
                alert('¡Registro exitoso! Intenta iniciar sesión.');
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadPicks() {
            const feed = document.getElementById('picksFeed');
            const { data: picks, error } = await supabase
                .from('picks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !picks || picks.length === 0) {
                feed.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 12px;">No hay pronósticos publicados aún.</p>`;
                return;
            }

            feed.innerHTML = '';
            picks.forEach(pick => {
                const card = document.createElement('div');
                card.className = 'pick-card';
                card.innerHTML = `
                    <div class="pick-header">
                        <span>${pick.meta}</span>
                        <span>Prob: <strong>${pick.prob}</strong></span>
                    </div>
                    <div class="pick-teams">${pick.teams}</div>
                    <div class="pick-info">
                        <span>Cuota: ${pick.odd}</span>
                        <span>Costo: ${pick.cost} crédito(s)</span>
                    </div>
                    <div class="locked-content">🔒 Contenido bloqueado</div>
                `;
                feed.appendChild(card);
            });
        }
    </script>
</body>
</html>
